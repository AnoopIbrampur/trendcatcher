name: collect

# Hourly data collection. Writes new snapshot files to the `data` branch; each source
# decides whether it's due this hour (see trendcatcher/cloud.py SCHEDULE).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to run now, space-separated (blank = whatever is due this hour)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # collection only needs the HTTP + storage code, not the app's UI/ML dependencies
      - run: pip install requests pandas && pip install -e . --no-deps
      - name: Collect
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          SOURCES: ${{ inputs.sources }}
        run: |
          if [ -n "$SOURCES" ]; then
            python -m trendcatcher collect --store store --sources $SOURCES
          else
            python -m trendcatcher collect --store store --auto
          fi
      - name: Commit to data branch
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "collect $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1
