name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # Tests run offline: no network calls, no Ollama, no stored data.
      - run: pip install -e ".[dev]"
      - run: pytest -q
