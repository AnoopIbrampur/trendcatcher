<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Trend Catcher</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff375f'/%3E%3Cpath d='M7 21l6-7 4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ---------------------------------------------------------------- tokens */
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-2: #f2f2f5;
  --surface-3: #e8e8ed;
  --text: #1d1d1f;
  --text-2: #5f5f64;
  --text-3: #86868b;
  --sep: rgba(0, 0, 0, .08);
  --sep-strong: rgba(0, 0, 0, .14);
  --chrome: rgba(245, 245, 247, .72);
  --chrome-edge: rgba(255, 255, 255, .6);
  --popover: rgba(255, 255, 255, .82);
  --accent: #0071e3;
  --accent-soft: rgba(0, 113, 227, .12);
  --green: #248a3d;
  --green-soft: rgba(52, 199, 89, .16);
  --orange: #c93400;
  --orange-soft: rgba(255, 149, 0, .16);
  --red: #d70015;
  --red-soft: rgba(255, 59, 48, .12);
  --pink: #e3005b;
  --blue: #0071e3;
  --gray: #8e8e93;
  --gray-soft: rgba(142, 142, 147, .16);
  --ring-track: rgba(0, 0, 0, .07);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 16px rgba(0, 0, 0, .04);
  --shadow-card-hover: 0 2px 4px rgba(0, 0, 0, .05), 0 12px 32px rgba(0, 0, 0, .08);
  --shadow-pop: 0 12px 48px rgba(0, 0, 0, .18), 0 2px 8px rgba(0, 0, 0, .08);
  --radius-card: 18px;
  --radius-ctl: 10px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --surface-3: #3a3a3c;
    --text: #f5f5f7;
    --text-2: #aeaeb2;
    --text-3: #7c7c80;
    --sep: rgba(255, 255, 255, .08);
    --sep-strong: rgba(255, 255, 255, .16);
    --chrome: rgba(16, 16, 18, .7);
    --chrome-edge: rgba(255, 255, 255, .06);
    --popover: rgba(40, 40, 44, .86);
    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, .2);
    --green: #30d158;
    --green-soft: rgba(48, 209, 88, .18);
    --orange: #ff9f0a;
    --orange-soft: rgba(255, 159, 10, .18);
    --red: #ff453a;
    --red-soft: rgba(255, 69, 58, .18);
    --pink: #ff375f;
    --blue: #0a84ff;
    --gray: #8e8e93;
    --gray-soft: rgba(142, 142, 147, .2);
    --ring-track: rgba(255, 255, 255, .1);
    --shadow-card: 0 0 0 1px rgba(255, 255, 255, .05);
    --shadow-card-hover: 0 0 0 1px rgba(255, 255, 255, .09), 0 12px 32px rgba(0, 0, 0, .5);
    --shadow-pop: 0 0 0 1px rgba(255, 255, 255, .08), 0 16px 56px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}

/* ---------------------------------------------------------------- base */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.47 var(--font);
  letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* press feedback lives on pointer-down and is instant */
.pressable { transition: transform 120ms ease-out, background-color 150ms ease, color 150ms ease, box-shadow 200ms ease; }
.pressable:active { transform: scale(.96); transition-duration: 60ms; }

/* ---------------------------------------------------------------- chrome */
.chrome {
  position: sticky; top: 0; z-index: 20;
  background: var(--chrome);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  backdrop-filter: saturate(180%) blur(24px);
  border-bottom: 1px solid transparent;
  transition: border-color 200ms ease;
}
.chrome.scrolled { border-bottom-color: var(--sep); }
.bar {
  max-width: 1180px; margin: 0 auto; padding: 10px 24px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  background: linear-gradient(135deg, #ff375f, #ff9f0a);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .35) inset, 0 2px 6px rgba(255, 55, 95, .35);
}
.bar-right { justify-self: end; display: flex; gap: 8px; align-items: center; }

/* segmented control */
.segmented {
  position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  background: var(--surface-3); border-radius: 9px; padding: 2px;
}
.segmented button {
  position: relative; z-index: 1; padding: 5px 18px; font-size: 13px; font-weight: 500;
  border-radius: 7px; color: var(--text-2); white-space: nowrap;
}
.segmented button[aria-selected="true"] { color: var(--text); }
.seg-indicator {
  position: absolute; top: 2px; bottom: 2px; left: 0; border-radius: 7px;
  background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04);
  will-change: transform, width;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg-indicator { background: #636366; } }

.loc-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 10px;
  border-radius: 999px; background: var(--surface); box-shadow: 0 0 0 1px var(--sep-strong);
  font-size: 13px; font-weight: 500; letter-spacing: -0.005em;
}
.loc-btn:hover { background: var(--surface-2); }
.loc-btn svg { color: var(--accent); flex: none; }
.loc-btn .chev { color: var(--text-3); }
.icon-btn {
  width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; color: var(--text-2);
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.spinning svg { animation: spin 900ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* filter row (second row of the chrome, feed tab only) */
.filters {
  max-width: 1180px; margin: 0 auto; padding: 4px 24px 12px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
}
.filters[hidden] { display: none; }
.fgroup { display: flex; align-items: center; gap: 6px; }
.flabel { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); margin-right: 2px; }
.pill {
  height: 28px; padding: 0 11px; border-radius: 999px; font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); color: var(--text-2); box-shadow: 0 0 0 1px var(--sep-strong);
}
.pill:hover { color: var(--text); }
.pill[aria-pressed="true"] { background: var(--text); color: var(--bg); box-shadow: none; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; }
.pill[aria-pressed="true"] .glyph { color: inherit !important; }
.pill .count { font-variant-numeric: tabular-nums; opacity: .6; font-size: 12px; }

/* slider */
.slider { display: flex; align-items: center; gap: 10px; }
.slider-track {
  position: relative; width: 132px; height: 28px; touch-action: none; cursor: pointer;
}
.slider-rail { position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 2px; background: var(--surface-3); }
.slider-fill { position: absolute; left: 0; top: 12px; height: 4px; border-radius: 2px; background: var(--accent); }
.slider-thumb {
  position: absolute; top: 4px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%;
  background: #fff; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .12), 0 2px 6px rgba(0, 0, 0, .2);
  transition: transform 120ms ease-out;
}
.slider-track.dragging .slider-thumb, .slider-track:active .slider-thumb { transform: scale(1.12); }
.slider-value { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 22px; color: var(--text); }

/* switch */
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--text-2); }
.switch-track {
  position: relative; width: 38px; height: 23px; border-radius: 999px; background: var(--surface-3);
  transition: background-color 220ms ease;
}
.switch-knob {
  position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 50%; background: #fff;
  box-shadow: 0 2px 4px rgba(0, 0, 0, .2), 0 0 0 .5px rgba(0, 0, 0, .05);
  transition: transform 260ms cubic-bezier(.3, 1.3, .5, 1);
}
.switch[aria-checked="true"] .switch-track { background: var(--green); }
.switch[aria-checked="true"] .switch-knob { transform: translateX(15px); }
.switch:disabled { opacity: .4; cursor: not-allowed; }

/* ---------------------------------------------------------------- page */
main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 96px; }
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--pink); letter-spacing: .01em; margin-bottom: 4px; }
h1 {
  margin: 0; font-size: clamp(30px, 4.4vw, 44px); line-height: 1.06; letter-spacing: -0.028em; font-weight: 700;
}
.sub { margin-top: 8px; color: var(--text-2); font-size: 15px; }
.sub strong { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.stats { display: flex; gap: 10px; }
.stat {
  min-width: 96px; padding: 10px 14px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow-card);
}
.stat b { display: block; font-size: 22px; line-height: 1.1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--text-3); }
.notice {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; margin-bottom: 18px;
  border-radius: 14px; background: var(--accent-soft); color: var(--text); font-size: 13px;
}
.notice svg { color: var(--accent); flex: none; margin-top: 1px; }

/* ---------------------------------------------------------------- cards */
.feed { display: flex; flex-direction: column; gap: 10px; }
.card {
  background: var(--surface); border-radius: var(--radius-card); box-shadow: var(--shadow-card);
  transition: box-shadow 250ms ease;
}
.card:hover, .card.open { box-shadow: var(--shadow-card-hover); }
.card[hidden] { display: none; }
.card-head {
  width: 100%; display: grid; grid-template-columns: 48px 1fr auto; gap: 14px; align-items: center;
  padding: 14px 16px 14px 14px; text-align: left; border-radius: var(--radius-card);
}
.card-head:active { transform: scale(.993); }
.ring { position: relative; width: 48px; height: 48px; }
.ring svg { transform: rotate(-90deg); }
.ring b {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 15px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
}
.card-title {
  font-size: 17px; font-weight: 600; letter-spacing: -0.017em; line-height: 1.25;
  overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 5px; }
.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px; border-radius: 6px;
  font-size: 12px; font-weight: 600; letter-spacing: .005em; white-space: nowrap;
}
.badge.emerging { background: var(--green-soft); color: var(--green); }
.badge.peaking { background: var(--orange-soft); color: var(--orange); }
.badge.fading, .badge.unknown { background: var(--gray-soft); color: var(--text-2); }
.badge.local { background: var(--accent-soft); color: var(--accent); }
.badge.fit { background: var(--surface-2); color: var(--text-2); font-variant-numeric: tabular-nums; }
.badge.fit.hi { color: var(--green); }
.badge.fit.lo { color: var(--text-3); }
.badge.avoid-flag { background: var(--red-soft); color: var(--red); }
.rank-note { font-size: 12px; color: var(--text-3); margin: -2px 0 12px; line-height: 1.45; }
.rank-note b { color: var(--text-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.badge.cat { background: transparent; color: var(--text-3); font-weight: 500; padding: 0 2px; }
.srcs { display: inline-flex; gap: 4px; }
.glyph { display: inline-grid; place-items: center; width: 21px; height: 21px; border-radius: 6px; background: var(--surface-2); }
.glyph.tiktok { color: var(--pink); }
.glyph.youtube { color: var(--red); }
.glyph.google_trends { color: var(--blue); }
.glyph.wikipedia { color: var(--text); }
.glyph.reddit { color: var(--orange); }
.chev-wrap { color: var(--text-3); width: 28px; height: 28px; display: grid; place-items: center; }
.chev-wrap svg { transition: transform 300ms cubic-bezier(.2, .8, .2, 1); }
.card.open .chev-wrap svg { transform: rotate(90deg); }

.card-body { height: 0; overflow: hidden; }
.card-inner {
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px;
  padding: 2px 16px 16px 76px;
}
.panel { background: var(--surface-2); border-radius: 14px; padding: 14px 16px; }
.panel.brief { align-self: start; position: sticky; top: calc(var(--chrome-h, 110px) + 12px); }
.more { margin-top: 12px; }
.panel h3 {
  margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3);
}
.signal + .signal, .more-items .signal { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--sep); }
.signal-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); font-weight: 500; }
.signal-title { display: block; margin-top: 4px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; line-height: 1.3; word-break: break-word; }
.kv { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 8px; }
.kv div { font-size: 12px; color: var(--text-3); }
.kv b { display: block; font-size: 15px; color: var(--text); font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.spark { margin-top: 10px; }
.spark svg { display: block; width: 100%; height: 56px; overflow: visible; }
.spark-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-top: 2px; }
.meter { margin-top: 10px; }
.meter-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-3); margin-bottom: 5px; }
.meter-label b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.meter-bar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.meter-bar i { display: block; height: 100%; border-radius: 3px; }
.news { list-style: none; margin: 8px 0 0; padding: 0; }
.news li { font-size: 13px; line-height: 1.4; padding: 5px 0; }
.news li span { color: var(--text-3); }

/* brief */
.brief-empty { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; color: var(--text-2); font-size: 13px; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 16px; border-radius: 999px;
  font-size: 14px; font-weight: 600; letter-spacing: -0.005em;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn-plain { color: var(--accent); height: auto; padding: 0; font-weight: 500; font-size: 13px; }
.what { font-size: 15px; line-height: 1.45; margin: 0 0 12px; }
.what.unclear { color: var(--text-2); font-style: italic; }
.brief-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.brief-row .meter { margin-top: 0; }
.safety { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-3); }
.safety .badge { align-self: flex-start; text-transform: capitalize; }
.badge.safe { background: var(--green-soft); color: var(--green); }
.badge.caution { background: var(--orange-soft); color: var(--orange); }
.badge.avoid { background: var(--red-soft); color: var(--red); }
.reason { font-size: 12px; color: var(--text-2); line-height: 1.4; margin: -4px 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; background: var(--surface); box-shadow: 0 0 0 1px var(--sep); color: var(--text-2); }
.angles { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.angle { background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.angle q { display: block; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.35; quotes: "“" "”"; }
.angle span { display: block; font-size: 12px; color: var(--text-3); margin-top: 3px; }
.brief-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 12px; color: var(--text-3); }
.shimmer { display: flex; flex-direction: column; gap: 8px; }
.shimmer i {
  display: block; height: 12px; border-radius: 6px;
  background: linear-gradient(90deg, var(--surface-3) 0%, var(--surface) 50%, var(--surface-3) 100%);
  background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite;
}
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.err { color: var(--red); font-size: 13px; }

/* skeleton feed */
.skeleton { height: 76px; border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow-card); position: relative; overflow: hidden; }
.skeleton::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, var(--surface-2), transparent);
  animation: sweep 1.5s ease-in-out infinite;
}
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

.empty { text-align: center; padding: 64px 16px; color: var(--text-2); }
.empty h2 { font-size: 20px; letter-spacing: -0.015em; color: var(--text); margin: 12px 0 6px; }

/* ---------------------------------------------------------------- popovers */
.popover {
  position: fixed; z-index: 50; min-width: 240px; max-width: min(340px, calc(100vw - 32px));
  background: var(--popover); border-radius: 14px; box-shadow: var(--shadow-pop);
  -webkit-backdrop-filter: saturate(180%) blur(30px); backdrop-filter: saturate(180%) blur(30px);
  padding: 6px; transform-origin: top right; opacity: 0; will-change: transform, opacity;
}
.popover[hidden] { display: none; }
.pop-search {
  display: flex; align-items: center; gap: 6px; margin: 2px 2px 6px; padding: 0 10px; height: 32px;
  border-radius: 9px; background: var(--surface-3); color: var(--text-3);
}
.pop-search input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: var(--text); }
.pop-list { max-height: min(420px, 60vh); overflow: auto; overscroll-behavior: contain; }
.pop-group { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); padding: 10px 10px 4px; }
.pop-item {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 7px 10px; border-radius: 8px; font-size: 14px; text-align: left;
}
.pop-item:hover, .pop-item.active { background: var(--accent); color: #fff; }
.pop-item:hover .check, .pop-item.active .check, .pop-item:hover .code, .pop-item.active .code { color: #fff; }
.pop-item .check { color: var(--accent); visibility: hidden; }
.pop-item[aria-selected="true"] .check { visibility: visible; }
.pop-item .code { font-size: 12px; color: var(--text-3); font-family: var(--mono); }
.pop-foot { display: flex; justify-content: space-between; padding: 8px 10px 4px; border-top: 1px solid var(--sep); margin-top: 4px; font-size: 13px; }

/* ---------------------------------------------------------------- health */
.health-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-bottom: 28px; }
.hcard { background: var(--surface); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 16px; }
.hcard-head { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.hcard-head .glyph { width: 28px; height: 28px; border-radius: 8px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; margin-top: 10px; }
.status i { width: 8px; height: 8px; border-radius: 50%; }
.status.ok i { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.status.error i { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
.status.skipped i, .status.none i { background: var(--gray); box-shadow: 0 0 0 3px var(--gray-soft); }
.hmsg { font-size: 12px; color: var(--text-3); margin-top: 6px; line-height: 1.4; word-break: break-word; }
h2.section { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 12px; }
.runs { background: var(--surface); border-radius: var(--radius-card); box-shadow: var(--shadow-card); overflow: hidden; }
.run { display: grid; grid-template-columns: 26px 130px 1fr 80px; gap: 12px; align-items: center; padding: 10px 16px; font-size: 13px; }
.run + .run { border-top: 1px solid var(--sep); }
.run .when { color: var(--text-3); font-variant-numeric: tabular-nums; }
.run .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
.run .msg { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------------------------------------------------------------- toast */
.toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 60; transform: translateX(-50%);
  background: var(--popover); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px);
  box-shadow: var(--shadow-pop); border-radius: 999px; padding: 10px 18px; font-size: 14px; font-weight: 500;
  opacity: 0; pointer-events: none; transition: opacity 200ms ease, transform 300ms cubic-bezier(.2, .8, .2, 1);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

/* ---------------------------------------------------------------- responsive */
@media (max-width: 820px) {
  .bar { grid-template-columns: auto 1fr; padding: 10px 16px; }
  .bar .segmented { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; }
  .brand-name { display: none; }
  .filters {
    padding: 4px 16px 10px; gap: 14px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
    mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
  }
  .filters::-webkit-scrollbar { display: none; }
  .fgroup, .slider, .switch, #catBtn { flex: none; }
  .panel.brief { position: static; }
  main { padding: 20px 16px 80px; }
  .hero { flex-direction: column; align-items: flex-start; }
  .card-inner { grid-template-columns: 1fr; padding: 2px 12px 14px; }
  .card-head { grid-template-columns: 44px 1fr auto; padding: 12px; gap: 12px; }
  .ring, .ring svg { width: 44px; height: 44px; }
  .run { grid-template-columns: 22px 1fr 60px; }
  .run .msg { display: none; }
}

/* ---------------------------------------------------------------- accessibility */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
  .pressable:active, .card-head:active { transform: none; }
  .switch-knob, .chev-wrap svg { transition-duration: 1ms; }
}
@media (prefers-reduced-transparency: reduce) {
  .chrome { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; border-bottom-color: var(--sep); }
  .popover, .toast { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
@media (prefers-contrast: more) {
  :root { --sep: rgba(0, 0, 0, .3); --sep-strong: rgba(0, 0, 0, .5); --text-3: #555; }
  .card, .hcard, .stat { box-shadow: 0 0 0 1px var(--sep-strong); }
}
</style>
</head>
<body>
<header class="chrome" id="chrome">
  <div class="bar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 11.5l4-4.5 3 3 5-6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-name">Trend Catcher</span>
    </div>
    <div class="segmented" role="tablist" aria-label="View" id="tabs">
      <span class="seg-indicator" id="segIndicator" aria-hidden="true"></span>
      <button role="tab" class="pressable" data-tab="feed" aria-selected="true">Feed</button>
      <button role="tab" class="pressable" data-tab="health" aria-selected="false">Health</button>
    </div>
    <div class="bar-right">
      <button class="icon-btn pressable" id="refreshBtn" title="Rebuild feed" aria-label="Rebuild feed">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
      </button>
      <button class="loc-btn pressable" id="locBtn" aria-haspopup="listbox" aria-expanded="false">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M7 0a5 5 0 0 0-5 5c0 3.6 5 9 5 9s5-5.4 5-9a5 5 0 0 0-5-5zm0 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
        <span id="locName">Global</span>
        <svg class="chev" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4l2.5 2.5L7.5 4"/></svg>
      </button>
    </div>
  </div>
  <div class="filters" id="filters">
    <div class="fgroup" role="group" aria-label="Stage">
      <span class="flabel">Stage</span>

      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4l2.5 2.5L7.5 4"/></svg>
    </button>
    <div class="slider">
      <span class="flabel">Min score</span>

        <div class="slider-rail"></div><div class="slider-fill"></div><div class="slider-thumb"></div>
      </div>

    <button class="switch" id="localSwitch" role="switch" aria-checked="false">

      Local only
    </button>
  </div>
</header>

<main id="main">
  <section id="feedView">
    <div class="hero">
      <div>
        <div class="eyebrow" id="eyebrow">Trending now</div>
        <h1 id="title">Global</h1>
        <div class="sub" id="subtitle">Loading…</div>
      </div>

    </div>

</main>

<div class="popover" id="locPop" role="listbox" aria-label="Location" hidden>
  <label class="pop-search">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="6" r="4.5"/><path d="M9.5 9.5L13 13"/></svg>
    <input id="locSearch" type="text" placeholder="Search places" autocomplete="off" spellcheck="false" aria-label="Search places">
  </label>
  <div class="pop-list" id="locList"></div>
</div>
<div class="popover" id="catPop" role="listbox" aria-label="Category" aria-multiselectable="true" hidden>
  <div class="pop-list" id="catList"></div>
  <div class="pop-foot"><span id="catCount" style="color:var(--text-3)"></span><button class="btn-plain" id="catClear">Clear</button></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ================================================================ utilities */
const $ = (s, el = document) => el.querySelector(s);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => (typeof u === "string" && /^https?:\/\//i.test(u) ? u : null);
const compact = new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 });
const fmt = (n) => (n == null || isNaN(n) ? "–" : compact.format(n));
const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
function ago(iso) {
  if (!iso) return "never";
  const s = (new Date(iso).getTime() - Date.now()) / 1000;
  const units = [["year", 31536000], ["month", 2592000], ["day", 86400], ["hour", 3600], ["minute", 60]];
  for (const [u, sec] of units) if (Math.abs(s) >= sec) return rtf.format(Math.round(s / sec), u);
  return "just now";
}
const store = {
  get(k, d) { try { const v = localStorage.getItem("tc:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("tc:" + k, JSON.stringify(v)); } catch {} },
};
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "content-type": "application/json" }, ...opts });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || `Request failed (${r.status})`);
  return body;
}
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ================================================================ springs
   Critically damped by default (damping 1). Every animation starts from the live
   value and velocity of whatever it interrupts, so nothing jumps or hits a wall. */
function spring({ from, to, velocity = 0, response = 0.35, damping = 1, epsilon = 0.5, onUpdate, onDone }) {
  if (reduceMotion.matches) { onUpdate(to); onDone && onDone(); return { stop() {}, value: to, velocity: 0 }; }
  const k = (2 * Math.PI / response) ** 2, c = (4 * Math.PI * damping) / response;
  const st = { value: from, velocity, stopped: false, stop() { this.stopped = true; cancelAnimationFrame(raf); } };
  let last = performance.now(), raf;
  const tick = (now) => {
    if (st.stopped) return;
    const dt = Math.min(0.064, (now - last) / 1000); last = now;
    const n = Math.max(1, Math.ceil(dt / 0.004)), h = dt / n;
    for (let i = 0; i < n; i++) { const a = -k * (st.value - to) - c * st.velocity; st.velocity += a * h; st.value += st.velocity * h; }
    if (Math.abs(st.value - to) < epsilon && Math.abs(st.velocity) < epsilon * 4) {
      st.value = to; st.velocity = 0; onUpdate(to); onDone && onDone(); return;
    }
    onUpdate(st.value); raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  return st;
}

/* ================================================================ icons */
const ICON = {
  tiktok: '<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M8.2 0h-2v8.1a1.7 1.7 0 1 1-1.7-1.7c.2 0 .3 0 .5.1V4.4a3.8 3.8 0 1 0 3.2 3.7V4a4.5 4.5 0 0 0 2.6.8V2.8A2.6 2.6 0 0 1 8.2 0z"/></svg>',
  youtube: '<svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor"><path d="M12.7 3.7a1.6 1.6 0 0 0-1.1-1.1C10.6 2.3 6.5 2.3 6.5 2.3s-4.1 0-5.1.3A1.6 1.6 0 0 0 .3 3.7 17 17 0 0 0 0 6.5a17 17 0 0 0 .3 2.8 1.6 1.6 0 0 0 1.1 1.1c1 .3 5.1.3 5.1.3s4.1 0 5.1-.3a1.6 1.6 0 0 0 1.1-1.1 17 17 0 0 0 .3-2.8 17 17 0 0 0-.3-2.8zM5.2 8.3V4.7l3.4 1.8z"/></svg>',
  google_trends: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="5" cy="5" r="3.7"/><path d="M7.8 7.8L11 11"/></svg>',
  wikipedia: '<svg width="13" height="13" viewBox="0 0 13 13"><text x="6.5" y="10.4" text-anchor="middle" font-family="Georgia, Times, serif" font-size="11" font-weight="700" fill="currentColor">W</text></svg>',
  reddit: '<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M6 1C3 1 .5 2.9.5 5.3c0 1.3.7 2.4 1.9 3.2L2 11l2.6-1.5c.4.1.9.1 1.4.1 3 0 5.5-1.9 5.5-4.3S9 1 6 1z"/></svg>',
  chevron: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>',
  check: '<svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7l3 3 5-6.5"/></svg>',
  sparkle: '<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M7 0l1.6 4.4L13 6l-4.4 1.6L7 12 5.4 7.6 1 6l4.4-1.6zM12 9.5l.6 1.4 1.4.6-1.4.6L12 13.5l-.6-1.4-1.4-.6 1.4-.6z"/></svg>',
  info: '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm.9 12H7.1V7h1.8zM8 5.6A1.1 1.1 0 1 1 8 3.4a1.1 1.1 0 0 1 0 2.2z"/></svg>',
};
const SOURCE_NAME = { tiktok: "TikTok", youtube: "YouTube", google_trends: "Google", wikipedia: "Wikipedia", reddit: "Reddit" };
const SOURCE_ORDER = ["tiktok", "youtube", "google_trends", "wikipedia", "reddit"];
const STAGES = [["emerging", "Emerging"], ["peaking", "Peaking"], ["fading", "Fading"], ["unknown", "Unknown"]];
const glyph = (s) => `<span class="glyph ${esc(s)}" title="${esc(SOURCE_NAME[s] || s)}">${ICON[s] || ""}</span>`;

/* ================================================================ state */
const params = new URLSearchParams(location.search);
const state = {
  tab: params.get("tab") === "health" ? "health" : "feed",
  location: params.get("location") || null,
  data: null,
  locations: [],
  filters: store.get("filters", null) || { stages: ["emerging", "peaking"], sources: [], categories: [], minScore: 40, localOnly: false },
  reqId: 0,
};
state.filters.categories = []; // categories differ per place; don't carry them over

function syncUrl() {
  const p = new URLSearchParams();
  if (state.location) p.set("location", state.location);
  if (state.tab === "health") p.set("tab", "health");
  const qs = p.toString();
  history.replaceState(null, "", qs ? `?${qs}` : location.pathname);
}

/* ================================================================ chrome */
const chrome = $("#chrome");
new ResizeObserver(() => document.documentElement.style.setProperty("--chrome-h", chrome.offsetHeight + "px")).observe(chrome);
addEventListener("scroll", () => chrome.classList.toggle("scrolled", scrollY > 4), { passive: true });

// Segmented control: the indicator springs from wherever it currently is
let segAnim = { x: null, w: null };
function moveIndicator(animate = true) {
  const btn = $(`#tabs button[data-tab="${state.tab}"]`), ind = $("#segIndicator");
  const x = btn.offsetLeft, w = btn.offsetWidth;
  if (!animate || segAnim.x === null) {
    ind.style.transform = `translateX(${x}px)`; ind.style.width = w + "px"; segAnim = { x: { value: x }, w: { value: w } }; return;
  }
  const fx = segAnim.x.value, fw = segAnim.w.value, vx = segAnim.x.velocity || 0, vw = segAnim.w.velocity || 0;
  segAnim.x.stop && segAnim.x.stop(); segAnim.w.stop && segAnim.w.stop();
  segAnim.x = spring({ from: fx, to: x, velocity: vx, response: 0.32, epsilon: 0.3, onUpdate: (v) => (ind.style.transform = `translateX(${v}px)`) });
  segAnim.w = spring({ from: fw, to: w, velocity: vw, response: 0.32, epsilon: 0.3, onUpdate: (v) => (ind.style.width = v + "px") });
}
$("#tabs").addEventListener("pointerdown", (e) => {
  const b = e.target.closest("button[data-tab]"); if (!b || b.dataset.tab === state.tab) return;
  setTab(b.dataset.tab); // respond on press, not on release
});
$("#tabs").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  setTab(state.tab === "feed" ? "health" : "feed"); $(`#tabs button[data-tab="${state.tab}"]`).focus();
});
$("#tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b && e.detail === 0) setTab(b.dataset.tab); });
function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  moveIndicator(true);
  $("#feedView").hidden = tab !== "feed";
  $("#healthView").hidden = tab !== "health";
  $("#filters").hidden = tab !== "feed";
  syncUrl();
  if (tab === "health") loadHealth();
}

/* ================================================================ popovers
   Anchored to their trigger (transform-origin on the trigger's side), they grow out of it
   and return into it along the same path. Interruptible: reopening mid-close just retargets. */
const pops = {};
function makePopover(pop, trigger, { onOpen, align = "right" } = {}) {
  const p = { open: false, anim: null, scale: 0.94, opacity: 0 };
  const apply = () => { pop.style.opacity = p.opacity; pop.style.transform = `scale(${p.scale})`; };
  function place() {
    const r = trigger.getBoundingClientRect();
    pop.style.top = r.bottom + 8 + "px";
    if (align === "right") { pop.style.right = Math.max(12, innerWidth - r.right) + "px"; pop.style.left = "auto"; pop.style.transformOrigin = "top right"; }
    else { pop.style.left = Math.max(12, Math.min(r.left, innerWidth - 352)) + "px"; pop.style.right = "auto"; pop.style.transformOrigin = "top left"; }
  }
  function animateTo(open) {
    const fromS = p.scale, fromO = p.opacity, vS = p.anim?.s?.velocity || 0, vO = p.anim?.o?.velocity || 0;
    p.anim?.s?.stop(); p.anim?.o?.stop();
    const toS = open ? 1 : 0.94, toO = open ? 1 : 0;
    const s = spring({ from: fromS, to: toS, velocity: vS, response: 0.28, epsilon: 0.001, onUpdate: (v) => { p.scale = v; apply(); } });
    const o = spring({ from: fromO, to: toO, velocity: vO, response: open ? 0.2 : 0.16, epsilon: 0.004,
      onUpdate: (v) => { p.opacity = Math.max(0, Math.min(1, v)); apply(); }, onDone: () => { if (!p.open) pop.hidden = true; } });
    p.anim = { s, o };
  }
  p.show = () => {
    Object.values(pops).forEach((q) => q !== p && q.open && q.hide());
    p.open = true; pop.hidden = false; place(); trigger.setAttribute("aria-expanded", "true");
    animateTo(true); onOpen && onOpen();
  };
  p.hide = (focusTrigger = false) => {
    if (!p.open) return; p.open = false; trigger.setAttribute("aria-expanded", "false"); animateTo(false);
    if (focusTrigger) trigger.focus();
  };
  p.toggle = () => (p.open ? p.hide() : p.show());
  trigger.addEventListener("click", (e) => { e.stopPropagation(); p.toggle(); });
  pop.addEventListener("click", (e) => e.stopPropagation());
  addEventListener("resize", () => p.open && place());
  return p;
}
document.addEventListener("click", () => Object.values(pops).forEach((p) => p.hide()));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") Object.values(pops).forEach((p) => p.open && p.hide(true)); });

/* ---- location picker */
let locActive = -1;
function renderLocList() {
  const q = $("#locSearch").value.trim().toLowerCase();
  let html = "", idx = 0;
  for (const g of state.locations) {
    const items = g.items.filter((it) => !q || it.name.toLowerCase().includes(q) || (it.code || "").toLowerCase().includes(q));
    if (!items.length) continue;
    html += `<div class="pop-group">${esc(g.name)}</div>`;
    for (const it of items) {
      const sel = (it.code || null) === state.location;
      html += `<button class="pop-item" role="option" data-idx="${idx++}" data-code="${esc(it.code || "")}" aria-selected="${sel}">
        <span>${esc(it.name)}</span>
        <span style="display:flex;gap:8px;align-items:center">${it.code ? `<span class="code">${esc(it.code)}</span>` : ""}<span class="check">${ICON.check}</span></span></button>`;
    }
  }
  $("#locList").innerHTML = html || `<div class="pop-group" style="text-transform:none;letter-spacing:0">No matches</div>`;
  locActive = -1;
}
function locItems() { return [...document.querySelectorAll("#locList .pop-item")]; }
function setLocActive(i) {
  const items = locItems(); if (!items.length) return;
  locActive = (i + items.length) % items.length;
  items.forEach((el, j) => el.classList.toggle("active", j === locActive));
  items[locActive].scrollIntoView({ block: "nearest" });
}
$("#locSearch").addEventListener("input", renderLocList);
$("#locSearch").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); setLocActive(locActive + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setLocActive(locActive - 1); }
  else if (e.key === "Enter") { const it = locItems()[Math.max(0, locActive)]; it && chooseLocation(it.dataset.code || null); }
});
$("#locList").addEventListener("click", (e) => { const b = e.target.closest(".pop-item"); if (b) chooseLocation(b.dataset.code || null); });
function chooseLocation(code) {
  pops.loc.hide(true);
  if (code === state.location) return;
  state.location = code; syncUrl(); loadFeed();
}

/* ---- category picker */
function renderCatList() {
  const counts = new Map();
  for (const t of state.data?.trends || []) for (const c of t.category) counts.set(c, (counts.get(c) || 0) + 1);
  const cats = [...counts.entries()].sort((a, b) => b[1] - a[1]);
  $("#catList").innerHTML = cats.length
    ? cats.map(([c, n]) => `<button class="pop-item" role="option" data-cat="${esc(c)}" aria-selected="${state.filters.categories.includes(c)}">
        <span>${esc(c)}</span><span style="display:flex;gap:8px;align-items:center"><span class="code">${n}</span><span class="check">${ICON.check}</span></span></button>`).join("")
    : `<div class="pop-group" style="text-transform:none;letter-spacing:0">No categories here</div>`;
  const n = state.filters.categories.length;
  $("#catCount").textContent = n ? `${n} selected` : "Any category";
  $("#catLabel").textContent = n === 0 ? "All categories" : n === 1 ? state.filters.categories[0] : `${n} categories`;
  $("#catBtn").setAttribute("aria-pressed", String(n > 0));
}
$("#catList").addEventListener("click", (e) => {
  const b = e.target.closest(".pop-item"); if (!b) return;
  const c = b.dataset.cat, f = state.filters;
  f.categories = f.categories.includes(c) ? f.categories.filter((x) => x !== c) : [...f.categories, c];
  renderCatList(); applyFilters();
});

/* ================================================================ filters */
function renderPills() {

// toggles respond on pointer-down: the filter applies the instant you press
function onPillPress(e) {

// Score slider: tracks the pointer 1:1, with pointer capture, from the very first press
const slider = $("#scoreSlider");
function setScore(v) {
  v = Math.round(Math.max(0, Math.min(100, v)));

  slider.querySelector(".slider-thumb").style.left = v + "%";
  slider.setAttribute("aria-valuenow", v);

}
const fromPointer = (e) => ((e.clientX - slider.getBoundingClientRect().left) / slider.offsetWidth) * 100;
slider.addEventListener("pointerdown", (e) => {
  slider.setPointerCapture(e.pointerId); slider.classList.add("dragging"); setScore(fromPointer(e));
});
slider.addEventListener("pointermove", (e) => { if (slider.hasPointerCapture(e.pointerId)) setScore(fromPointer(e)); });
const endDrag = (e) => { slider.classList.remove("dragging"); if (slider.hasPointerCapture(e.pointerId)) slider.releasePointerCapture(e.pointerId); };
slider.addEventListener("pointerup", endDrag); slider.addEventListener("pointercancel", endDrag);
slider.addEventListener("keydown", (e) => {
  const step = e.shiftKey ? 10 : 1, v = state.filters.minScore;
  const map = { ArrowRight: v + step, ArrowUp: v + step, ArrowLeft: v - step, ArrowDown: v - step, Home: 0, End: 100 };
  if (e.key in map) { e.preventDefault(); setScore(map[e.key]); }
});

const localSwitch = $("#localSwitch");
localSwitch.addEventListener("click", () => {
  state.filters.localOnly = !state.filters.localOnly;
  localSwitch.setAttribute("aria-checked", String(state.filters.localOnly)); applyFilters();
});

function matches(t) {
  const f = state.filters;
  if (!f.stages.includes(t.stage)) return false;
  if (t.score < f.minScore) return false;
  if (f.sources.length && !t.sources.some((s) => f.sources.includes(s))) return false;
  if (f.categories.length && !t.category.some((c) => f.categories.includes(c))) return false;
  if (f.localOnly && state.location && !t.local) return false;
  return true;
}
function applyFilters() {
  store.set("filters", { ...state.filters, categories: [] });
  const d = state.data; if (!d) return;
  let shown = 0, shownLocal = 0;
  d.trends.forEach((t, i) => {
    const ok = matches(t); const el = cardEls[i];
    if (el) el.hidden = !ok;
    if (ok) { shown++; if (t.local) shownLocal++; }
  });
  $("#subtitle").innerHTML = `Showing <strong>${shown}</strong> of ${d.count} trends` +
    (state.location ? ` · <strong>${shownLocal}</strong> local` : "") + ` · ${esc(d.location_name)}`;
  const empty = $("#emptyState");
  if (empty) empty.hidden = shown !== 0;
}

/* ================================================================ feed */
let cardEls = [];
function ringSvg(score) {
  const r = 20, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, score)) / 100;
  const col = score >= 80 ? "var(--green)" : score >= 55 ? "var(--accent)" : "var(--gray)";
  return `<div class="ring" aria-label="Score ${Math.round(score)}"><svg width="48" height="48" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="4"/>
    <circle cx="24" cy="24" r="${r}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="${(c * p).toFixed(2)} ${c.toFixed(2)}"/></svg><b>${Math.round(score)}</b></div>`;
}

function renderFeed() {

/* ---- expanding cards: height springs from its live value, so a second tap mid-flight reverses smoothly */
function toggleCard(el, force) {
  const open = force ?? !el.classList.contains("open");
  const body = el.querySelector(".card-body"), inner = el.querySelector(".card-inner");
  if (open && !inner.dataset.rendered) {
    inner.innerHTML = renderDetail(el._trend); inner.dataset.rendered = "1"; wireBrief(el);
    inner.querySelectorAll(".show-more").forEach((b) => b.addEventListener("click", () => {
      const box = b.nextElementSibling; box.hidden = false; box.querySelectorAll(".signal").forEach((s) => s.classList.add("signal"));
      b.remove(); reflow(el);
    }));
  }
  el.classList.toggle("open", open);
  el.querySelector(".card-head").setAttribute("aria-expanded", String(open));
  animateHeight(el, open ? inner.offsetHeight : 0);
  inner.style.transition = "opacity 220ms ease, transform 320ms cubic-bezier(.2,.8,.2,1)";
  inner.style.opacity = open ? "1" : "0";
  inner.style.transform = open ? "none" : "translateY(-6px)";
}
function animateHeight(el, target) {
  const body = el.querySelector(".card-body");
  const from = el._h ? el._h.value : body.getBoundingClientRect().height;
  const v = el._h ? el._h.velocity : 0;
  el._h && el._h.stop();
  body.style.overflow = "hidden";
  el._h = spring({
    from, to: target, velocity: v, response: 0.42, epsilon: 0.5,
    onUpdate: (h) => (body.style.height = Math.max(0, h) + "px"),
    onDone: () => { el._h = null; if (target > 0) { body.style.height = "auto"; body.style.overflow = "visible"; } },
  });
}
// content inside an open card changed size (brief arrived): spring to the new height
function reflow(el) {
  if (!el.classList.contains("open")) return;
  const body = el.querySelector(".card-body"), inner = el.querySelector(".card-inner");
  const cur = body.getBoundingClientRect().height;
  if (!el._h) { body.style.height = cur + "px"; el._h = null; }
  animateHeight(el, inner.offsetHeight);
}

function sparkline(curve) {
  if (!curve || curve.length < 2) return "";
  const w = 280, h = 56, max = Math.max(...curve, 1), n = curve.length;
  const pts = curve.map((v, i) => [(i / (n - 1)) * w, h - 4 - (v / max) * (h - 10)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = `${line} L${w} ${h} L0 ${h} Z`, id = "g" + Math.random().toString(36).slice(2, 8);
  const last = pts[pts.length - 1];
  return `<div class="spark"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="7-day TikTok popularity">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--pink)" stop-opacity=".28"/><stop offset="1" stop-color="var(--pink)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="var(--pink)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--pink)" stroke="var(--surface-2)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="spark-axis"><span>7 days ago</span><span>Today</span></div></div>`;
}
function meter(label, value, max, color, text) {
  const pct = Math.max(0, Math.min(1, value / max)) * 100;
  return `<div class="meter"><div class="meter-label"><span>${esc(label)}</span><b>${esc(text)}</b></div>
    <div class="meter-bar"><i style="width:${pct}%;background:${color}"></i></div></div>`;
}
function link(url, text) {
  const u = safeUrl(url);
  return u ? `<a class="signal-title" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>` : `<span class="signal-title">${esc(text)}</span>`;
}
function renderSignal(m) {
  const d = m.detail || {};
  const head = (extra) => `<div class="signal-head">${glyph(m.source)}<span>${esc(SOURCE_NAME[m.source] || m.source)}${extra ? " · " + esc(extra) : ""}</span></div>`;
  if (m.source === "tiktok") {
    return `<div class="signal">${head([m.category, m.regions].filter(Boolean).join(" · "))}${link(m.url, m.title)}
      <div class="kv"><div><b>${fmt(d.views)}</b>views · 7d</div><div><b>${fmt(d.posts)}</b>posts</div><div><b>${fmt(d.views_per_post)}</b>views per post</div></div>
      ${sparkline(m.curve)}</div>`;
  }
  if (m.source === "wikipedia") {
    const p = d.p_hot;
    return `<div class="signal">${head(m.regions === "en" ? "worldwide" : m.regions)}${link(m.url, m.title)}
      <div class="kv"><div><b>${fmt(d.views)}</b>views yesterday</div><div><b>${d.ratio ? d.ratio.toFixed(1) + "×" : "–"}</b>vs 7-day normal</div></div>
      ${p != null ? meter("Chance it stays hot for 3 days", p, 1, p >= 0.7 ? "var(--green)" : p >= 0.4 ? "var(--orange)" : "var(--gray)", Math.round(p * 100) + "%") : ""}</div>`;
  }
  if (m.source === "google_trends") {
    const news = (d.news || []).filter((n) => n && n.title).slice(0, 3);
    return `<div class="signal">${head(m.regions)}${link(m.url, m.title)}
      <div class="kv"><div><b>${fmt(d.traffic)}+</b>searches</div><div><b>${d.age_hours != null ? Math.round(d.age_hours) + "h" : "–"}</b>since it started</div></div>
      ${news.length ? `<ul class="news">${news.map((n) => {
        const u = safeUrl(n.url);
        return `<li>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a>` : esc(n.title)} <span>· ${esc(n.source || "")}</span></li>`;
      }).join("")}</ul>` : ""}</div>`;
  }
  if (m.source === "youtube") {
    return `<div class="signal">${head([d.channel, m.category].filter(Boolean).join(" · "))}${link(m.url, m.title)}
      <div class="kv"><div><b>${fmt(m.value)}</b>views</div><div><b>${fmt(d.per_hour)}</b>views per hour</div>
      ${d.published_at ? `<div><b>${esc(ago(d.published_at))}</b>uploaded</div>` : ""}</div></div>`;
  }
  return `<div class="signal">${head("")}${link(m.url, m.title)}<div class="kv"><div><b>${fmt(m.value)}</b>score</div></div></div>`;
}
const PER_SOURCE = 3;
function renderDetail(t) {
  const members = [...t.members].sort((a, b) => SOURCE_ORDER.indexOf(a.source) - SOURCE_ORDER.indexOf(b.source) || (b.score || 0) - (a.score || 0));
  const shown = [], hidden = {}, seen = {};
  for (const m of members) {
    seen[m.source] = (seen[m.source] || 0) + 1;
    (seen[m.source] <= PER_SOURCE ? shown : (hidden[m.source] ||= [])).push(m);
  }
  const more = Object.entries(hidden).map(([src, ms]) =>
    `<div class="more"><button class="btn-plain pressable show-more" data-src="${esc(src)}">Show ${ms.length} more from ${esc(SOURCE_NAME[src] || src)}</button>
      <div class="more-items" hidden>${ms.map(renderSignal).join("")}</div></div>`).join("");
  const note = t.base_score != null && t.fit != null
    ? `<p class="rank-note">Attention <b>${Math.round(t.base_score)}</b> × creator fit <b>${Math.round(t.fit)}/10</b>${t.safety === "avoid" ? " × brand-safety penalty" : ""} → ranked at <b>${Math.round(t.score)}</b></p>`
    : t.base_score != null ? `<p class="rank-note">Attention <b>${Math.round(t.base_score)}</b> · creator fit not rated yet</p>` : "";
  return `<div class="panel signals"><h3>Signals</h3>${note}${shown.map(renderSignal).join("")}${more}</div>
    <div class="panel brief" aria-live="polite"><h3>Video brief</h3><div class="brief-slot"></div></div>`;
}

function briefEmpty(el) {

function briefView(b) {

async function wireBrief(el) {
  const t = el._trend, slot = el.querySelector(".brief-slot");
  const set = (html) => { slot.innerHTML = html; bind(); reflow(el); };
  const bind = () => {
    slot.querySelector(".gen")?.addEventListener("click", () => generate(false));
    slot.querySelector(".regen")?.addEventListener("click", () => generate(true));
  };
  async function generate(refresh) {
    set(briefLoading());
    try {
      const r = await api("/api/brief", { method: "POST", body: JSON.stringify({ cluster_key: t.cluster_key, location: state.location, refresh }) });
      t.has_brief = true; set(briefView(r.brief));
    } catch (e) { set(briefEmpty(el) + `<p class="err" style="margin-top:10px">${esc(e.message)}</p>`); }
  }
  if (t.has_brief) {
    set(briefLoading());
    try {
      const qs = new URLSearchParams({ cluster_key: t.cluster_key }); if (state.location) qs.set("location", state.location);
      const r = await api(`/api/brief?${qs}`);
      set(r.brief ? briefView(r.brief) : briefEmpty(el));
    } catch { set(briefEmpty(el)); }
  } else set(briefEmpty(el));
}

/* ---- loading */
async function loadFeed() {
  const id = ++state.reqId;
  $("#feed").innerHTML = Array.from({ length: 6 }, () => `<div class="skeleton"></div>`).join("");
  $("#title").textContent = locationLabel(state.location);
  $("#locName").textContent = locationLabel(state.location);
  $("#subtitle").textContent = "Scoring trends…";
  $("#stats").innerHTML = ""; $("#notice").innerHTML = "";
  try {
    const qs = state.location ? `?location=${encodeURIComponent(state.location)}` : "";
    const d = await api(`/api/trends${qs}`);
    if (id !== state.reqId) return; // a newer request superseded this one
    state.data = d; renderFeed(); applyFilters();
  } catch (e) {
    if (id !== state.reqId) return;
    $("#feed").innerHTML = `<div class="empty"><h2>Couldn't load trends</h2><p>${esc(e.message)}</p>
      <button class="btn btn-primary pressable" onclick="loadFeed()">Try again</button></div>`;
    $("#subtitle").textContent = "";
  }
}
function locationLabel(code) {
  for (const g of state.locations) for (const it of g.items) if ((it.code || null) === code) return code && code.startsWith("US-") ? `${it.name}, US` : it.name;
  return code || "Global";
}
$("#refreshBtn").addEventListener("click", async () => {
  const b = $("#refreshBtn"); b.classList.add("spinning");
  try {
    await api(`/api/refresh${state.location ? `?location=${encodeURIComponent(state.location)}` : ""}`, { method: "POST" });

          <div class="status ${esc(st)}"><i></i>${esc(label)}</div>
          <div class="kv"><div><b>${fmt(s.rows)}</b>rows</div><div><b>${s.days != null ? Math.round(s.days) : "–"}</b>days</div><div><b>${s.regions != null ? Math.round(s.regions) : "–"}</b>places</div></div>
          <div class="hmsg">${s.last_ok ? "Last success " + esc(ago(s.last_ok)) : "Never succeeded"}${st !== "ok" && s.message ? " · " + esc(String(s.message).split("\n")[0].slice(0, 120)) : ""}</div></div>`;
      }).join("")}</div>
      <h2 class="section">Recent runs</h2>
      <div class="runs">${h.runs.slice(0, 40).map((r) => `<div class="run">${glyph(r.source)}
        <span class="when">${esc(ago(r.started_at))}</span>
        <span class="msg"><span class="status ${esc(r.status)}" style="margin:0"><i></i>${esc(r.status)}</span>${r.message ? " · " + esc(String(r.message).split("\n")[0].slice(0, 90)) : ""}</span>
        <span class="n">${fmt(r.n_items)} rows</span></div>`).join("")}</div>`;
  } catch (e) {
    v.innerHTML = `<div class="empty"><h2>Couldn't load health</h2><p>${esc(e.message)}</p></div>`;
  }
}

/* ================================================================ boot */
(async function boot() {
  pops.loc = makePopover($("#locPop"), $("#locBtn"), { onOpen: () => { $("#locSearch").value = ""; renderLocList(); setTimeout(() => $("#locSearch").focus(), 0); } });
  pops.cat = makePopover($("#catPop"), $("#catBtn"), { align: "left", onOpen: renderCatList });
  try { state.locations = (await api("/api/locations")).groups; } catch { state.locations = []; }
  renderPills(); setScore(state.filters.minScore);
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
  $("#feedView").hidden = state.tab !== "feed"; $("#healthView").hidden = state.tab !== "health"; $("#filters").hidden = state.tab !== "feed";
  requestAnimationFrame(() => moveIndicator(false));
  addEventListener("resize", () => moveIndicator(false));
  loadFeed();
  if (state.tab === "health") loadHealth();
})();
</script>
</body>
</html>
